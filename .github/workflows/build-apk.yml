name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
Jjobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Release Keystore and Build
        run: |
          keytool -genkey -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias avayar -storepass avayar1234 -keypass avayar1234 -dname "CN=Avayar, OU=App, O=Avayar, L=Tehran, ST=Tehran, C=IR"
          gradle --no-daemon clean assembleRelease
          UNGIGNED_APK=$(find app/build/outputs/apk/release -name "*-unsigned.apk" -o -name "*release*.apk" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore my-release-key.jks -storepass avayar1234 -keypass avayar1234 $UNCIGNED_APK avayar
          mkdir -p output_apk
          cp $UNGIGNED_APK output_apk/avayar-release-signed.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: avayar-signed-release-apk
          path: output_apk/avayar-release-signed.apk
          if-no-files-found: error
          retention-days: 14
