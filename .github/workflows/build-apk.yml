name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Prepare Permanent Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/avayar-permanent-release.jks
            echo "Loaded permanent keystore from GitHub Secrets."
          else
            keytool -genkeypair -v -keystore app/avayar-permanent-release.jks -keyalg RSA -keysize 4096 -validity 10000 -alias avayar_official -storepass "AvayarSecure2026!" -keypass "AvayarSecure2026!" -dname "CN=Avayar Accessibility, OU=Accessibility Tools, O=Avayar, L=London, ST=London, C=GB"
            echo "Generated new 4096-bit keystore."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Release APK
        run: gradle --no-daemon clean assembleRelease

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: avayar-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: avayar-permanent-keystore
          path: app/avayar-permanent-release.jks
          retention-days: 14
